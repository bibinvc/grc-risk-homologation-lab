name: Validate educational GRC lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Validate scenario
        run: python app.py validate
      - name: Build deterministic reports
        run: python app.py report


